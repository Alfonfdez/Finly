appId: com.anonymous.FinlyApp
---
- runFlow:
    file: "helpers/state-reset.yaml"
- runFlow:
    file: "helpers/dismiss-dev-menu.yaml"
# 004 c1: the Home "+" FAB navigates to the add transaction screen
- tapOn: "Add expense or income"
- waitForAnimationToEnd
# 004 c2: header title (back arrow has no "Back" label on this screen)
- assertVisible: "Add transaction"
# 004 c2: "Expenses"/"Income" type tabs are shown
- assertVisible: "Expenses"
- assertVisible: "Income"
# 004 c4: default account is My Wallet (Total fallback rule)
- assertVisible: "Account"
- assertVisible: "My Wallet"
# 004 c3: amount input accepts a decimal value (default separator is comma)
- tapOn: "Amount input"
- inputText: "42,50"
- assertVisible: "42,50"
# 004 c5: category grid renders the seeded categories; select Groceries
- tapOn: "Groceries"
- waitForAnimationToEnd
# 004 c6: the 3 days show the correct labels; Today is selected by default
- assertVisible: "Today"
- assertVisible: "Yesterday"
- assertVisible: "Day before yesterday"
# 004 c7 / 019 c9: inline tag creation -> auto-selected and persisted
- scrollUntilVisible:
    element:
      text: "+ Add tag"
    direction: DOWN
- tapOn: "+ Add tag"
- waitForAnimationToEnd
- assertVisible: "Add tag"
- tapOn: "Tag name"
- inputText: "Urgent"
- waitForAnimationToEnd
- tapOn: "Add"
- waitForAnimationToEnd
- assertNotVisible: "Add tag"
- assertVisible: "Urgent"
# 004 c8: comment with dynamic counter
- scrollUntilVisible:
    element:
      text: "Comment input"
    direction: DOWN
- tapOn: "Comment input"
- inputText: "Weekly groceries"
- waitForAnimationToEnd
# 004 c14: "Add" creates the transaction and returns to Home
- scrollUntilVisible:
    element:
      text: "Add"
    direction: DOWN
- tapOn: "Add"
- waitForAnimationToEnd
- assertVisible: "Total"
# 004 c14: the transaction is persisted -> row in All transactions with tag chip
- runFlow:
    file: "helpers/open-drawer.yaml"
- tapOn: "All transactions"
- waitForAnimationToEnd
- assertVisible: "Back"
- assertVisible: "Groceries"
- assertVisible: "-42,50 €"
- assertVisible: "Weekly groceries"
- assertVisible: "Urgent"
